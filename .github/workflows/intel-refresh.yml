name: intel-refresh
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger refresh
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 --retry 2 --retry-all-errors -H "Authorization: Bearer $CRON_SECRET" https://cyber.nanoteofficial.me/api/cron/intel
